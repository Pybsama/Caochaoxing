name: Windows CI

on:
  push:
    paths:
      - 'windows/**'
      - 'android/core/**'
      - '.github/workflows/windows-ci.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'android/core/**'
      - '.github/workflows/windows-ci.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional GitHub Release tag to attach Windows artifacts to (e.g. v1.1.0)'
        required: false
        default: ''
      source_run_id:
        description: 'Optional existing Windows CI run ID to reuse already-built artifacts'
        required: false
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  build-and-package:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.source_run_id == '' }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run core and Windows desktop unit tests
        run: gradle :core:test :app:test

      - name: Build portable Windows distributable
        run: gradle :app:createDistributable

      - name: Zip portable Windows app
        shell: pwsh
        run: |
          Compress-Archive -Path "app/build/compose/binaries/main/app/Caochaoxing/*" -DestinationPath "app/build/Caochaoxing-windows-portable.zip" -Force

      - name: Upload Windows portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Caochaoxing-windows-portable
          path: windows/app/build/Caochaoxing-windows-portable.zip

      - name: Ensure WiX Toolset v3 is available for jpackage MSI
        shell: pwsh
        run: |
          $wixBin = $null
          if ($env:WIX -and (Test-Path (Join-Path $env:WIX "bin\candle.exe"))) {
            $wixBin = Join-Path $env:WIX "bin"
          } else {
            $found = Get-ChildItem "C:\Program Files (x86)\WiX Toolset v3*\bin\candle.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $wixBin = $found.Directory.FullName }
          }
          if (-not $wixBin) {
            choco install wixtoolset --no-progress -y
            $found = Get-ChildItem "C:\Program Files (x86)\WiX Toolset v3*\bin\candle.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $wixBin = $found.Directory.FullName }
          }
          if ($wixBin) {
            echo $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host "Using WiX Toolset at $wixBin"
          } else {
            throw "WiX Toolset v3 (candle.exe / light.exe) not found"
          }

      - name: Build Windows MSI installer
        shell: pwsh
        run: |
          gradle :app:packageMsi
          if ($LASTEXITCODE -ne 0) {
            Get-ChildItem "app/build/compose/logs/packageMsi" -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "=== $($_.Name) ==="
              Get-Content $_.FullName
            }
            exit $LASTEXITCODE
          }

      - name: Upload Windows MSI installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Caochaoxing-windows-msi
          path: windows/app/build/compose/binaries/main/msi/*.msi

      - name: Attach freshly built Windows assets to Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $msi = Get-ChildItem "app/build/compose/binaries/main/msi/*.msi" | Select-Object -First 1
          gh release upload "${{ inputs.release_tag }}" "app/build/Caochaoxing-windows-portable.zip" "$($msi.FullName)" --clobber

  attach-existing-artifacts:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.source_run_id != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts from run and upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/win-release
          gh run download "${{ inputs.source_run_id }}" --repo "${{ github.repository }}" --dir /tmp/win-release
          MSI_FILE=$(find /tmp/win-release -name "*.msi" | head -n 1)
          ZIP_FILE=$(find /tmp/win-release -name "Caochaoxing-windows-portable.zip" | head -n 1)
          ls -lh "$MSI_FILE" "$ZIP_FILE"
          gh release upload "${{ inputs.release_tag }}" "$MSI_FILE" "$ZIP_FILE" --repo "${{ github.repository }}" --clobber
